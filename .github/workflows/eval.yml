name: Agentic CI/CD Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install --upgrade pip
          uv pip install -r requirements.txt || uv pip install --system -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5

      - name: Pull Ollama Models
        run: |
          ollama pull llama3.2:3b

      - name: Run Tiered Testing Suite
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: |
          source .venv/bin/activate
          # Run Layer 1: Fast deterministic smoke tests
          pytest tests/test_smoke.py -v
          # Run Layer 2: Deep semantic LLM-as-a-Judge evaluation harness
          deepeval test run tests/test_eval.py